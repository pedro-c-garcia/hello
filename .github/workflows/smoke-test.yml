name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Smoke test (install & run)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run `geraXls.py` (short range)
        run: |
          python geraXls.py --start 2025-01-01 --end 2025-01-03 --output out/ci_cotacoes.xlsx

      - name: Verify output exists
        run: |
          python -c "import sys, os; sys.exit(0 if os.path.exists('out/ci_cotacoes.xlsx') else 1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cotacoes
          path: out/ci_cotacoes.xlsx
